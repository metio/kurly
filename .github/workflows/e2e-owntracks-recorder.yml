    branches: [main]
    paths:
      - 'workloads/owntracks-recorder/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-owntracks-recorder-${{ github.ref }}
  cancel-in-progress: true
jobs:
