    branches: [main]
    paths:
      - 'workloads/nginx-proxy-manager/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-nginx-proxy-manager-${{ github.ref }}
  cancel-in-progress: true
