# Per-workload e2e for mongodb-cluster (operator schema check). Self-gated on this
# workload plus the shared library and e2e machinery.
name: E2E mongodb-cluster
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: mongodb-cluster
      # yamllint disable-line rule:line-length
      paths: '^(workloads/mongodb-cluster/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-mongodb-cluster)\.sh|\.github/workflows/e2e(-mongodb-cluster)?\.yml)'
      scenario: hack/smoke/scenario-mongodb-cluster.sh
      max_versions: '1'
