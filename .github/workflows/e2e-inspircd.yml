name: E2E inspircd
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: inspircd
      # yamllint disable-line rule:line-length
