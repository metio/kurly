# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for airsonic-advanced. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E airsonic-advanced
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/airsonic-advanced/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-airsonic-advanced-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: airsonic-advanced
      paths: '^workloads/airsonic-advanced/'
      scenario: hack/smoke/scenario-airsonic-advanced.sh
      max_versions: '1'
