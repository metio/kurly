# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for beszel. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E beszel
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/beszel/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-beszel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: beszel
      paths: '^workloads/beszel/'
      scenario: hack/smoke/scenario-beszel.sh
      max_versions: '1'
