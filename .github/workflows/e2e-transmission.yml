# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for transmission. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E transmission
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: transmission
      # yamllint disable-line rule:line-length
      paths: '^(workloads/transmission/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-transmission)\.sh|\.github/workflows/e2e(-transmission)?\.yml)'
      scenario: hack/smoke/scenario-transmission.sh
