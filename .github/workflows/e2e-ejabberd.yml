# Per-workload e2e for ejabberd. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E ejabberd
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/ejabberd/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: ejabberd
      paths: '^workloads/ejabberd/'
