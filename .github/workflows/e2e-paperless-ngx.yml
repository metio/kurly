# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for paperless-ngx. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E paperless-ngx
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: paperless-ngx
      # yamllint disable-line rule:line-length
      paths: '^(workloads/paperless-ngx/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-paperless-ngx)\.sh|\.github/workflows/e2e(-paperless-ngx)?\.yml)'
      scenario: hack/smoke/scenario-paperless-ngx.sh
      max_versions: '1'
