# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for resilio-sync. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E resilio-sync
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/resilio-sync/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-resilio-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: resilio-sync
      paths: '^workloads/resilio-sync/'
      scenario: hack/smoke/scenario-resilio-sync.sh
      max_versions: '1'
