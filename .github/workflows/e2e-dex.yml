# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for dex. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E dex
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/dex/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: dex
      paths: '^workloads/dex/'
      scenario: hack/smoke/scenario-dex.sh
      max_versions: '1'
