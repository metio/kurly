# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for node-red. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E node-red
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: node-red
      # yamllint disable-line rule:line-length
      paths: '^(workloads/node-red/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-node-red)\.sh|\.github/workflows/e2e(-node-red)?\.yml)'
      scenario: hack/smoke/scenario-node-red.sh
