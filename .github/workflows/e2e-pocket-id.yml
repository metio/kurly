# Per-workload e2e for pocket-id. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E pocket-id
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/pocket-id/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-pocket-id-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: pocket-id
      paths: '^workloads/pocket-id/'
      scenario: hack/smoke/scenario-pocket-id.sh
      max_versions: '1'
