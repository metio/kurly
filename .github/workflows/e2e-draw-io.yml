# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for draw-io. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E draw-io
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/draw-io/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-draw-io-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: draw-io
      paths: '^workloads/draw-io/'
      scenario: hack/smoke/scenario-draw-io.sh
      max_versions: '1'
