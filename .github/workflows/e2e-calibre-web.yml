# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for calibre-web. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E calibre-web
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/calibre-web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-calibre-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: calibre-web
      paths: '^workloads/calibre-web/'
      scenario: hack/smoke/scenario-calibre-web.sh
      max_versions: '1'
