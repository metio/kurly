name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      # The assembler reads the catalog, so a catalog change must rebuild the
      # site even though no docs/ file changed.
      - catalog/**
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - catalog/**
permissions:
  contents: read
jobs:
  website:
    name: Website
    uses: metio/ci/.github/workflows/hugo.yml@92eaf0dff9859e52fbbc3f07c7f9eb832b31ea3b # 2026.11.15155907
    permissions:
      contents: write
    with:
      source: docs
      prepare: gen-catalog && gen-docs-data
      cname: kurly.projects.metio.wtf
