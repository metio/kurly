# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for stirling-pdf. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E stirling-pdf
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/stirling-pdf/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-stirling-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: stirling-pdf
      paths: '^workloads/stirling-pdf/'
      scenario: hack/smoke/scenario-stirling-pdf.sh
      max_versions: '1'
