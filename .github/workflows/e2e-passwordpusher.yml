# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for passwordpusher. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E passwordpusher
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/passwordpusher/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-passwordpusher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: passwordpusher
      paths: '^workloads/passwordpusher/'
      scenario: hack/smoke/scenario-passwordpusher.sh
      max_versions: '1'
