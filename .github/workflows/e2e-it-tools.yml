# Per-workload e2e for it-tools. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E it-tools
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: it-tools
      # yamllint disable-line rule:line-length
      paths: '^(workloads/it-tools/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-it-tools)\.sh|\.github/workflows/e2e(-it-tools)?\.yml)'
      scenario: hack/smoke/scenario-it-tools.sh
