# Every tool gate runs through the flake's devShell (`nix develop --command`),
# so CI and local shells resolve the exact same tool versions from flake.lock.
# Renovate maintains the lock; no job installs tools any other way.
name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command check-fmt
  catalog:
    # Regenerates catalog/catalog.json from the library annotations, commits it if
    # it moved, and only then fails on drift — which also runs the drift asserts
    # that fail when a feature and its annotation fall out of step.
    #
    # It commits because catalog.json is DERIVED. Renovate used to edit it through
    # eight custom managers so the committed copy tracked the image references it
    # copies, and a regex can copy a string but cannot recompute a resolution: a
    # meilisearch bump put the new TAG in catalog.json and left the OLD DIGEST
    # beside it, because several managers extracted the same dependency from the
    # same file and only one anchor was repaired. Every such bump then failed this
    # gate and waited for somebody to regenerate by hand.
    #
    # So the reference is written once, in workloads/<name>/<stage>.image, and the
    # derived file is regenerated here rather than transcribed by pattern.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Regenerate the derived catalog, and commit it if it moved
        run: |
          nix develop --command bash -c 'jsonnet -J vendor catalog/catalog.jsonnet > catalog/catalog.json'
          if ! git diff --quiet -- catalog/catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add catalog/catalog.json
            git commit -m 'chore(catalog): regenerate from the workload sources'
            git push
          fi
      - run: nix develop --command check-catalog
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # Vendors k8s-libsonnet (floats at upstream HEAD, matching the JOI
      # images), runs the assertion suite, and exercises the requiresService
      # negative check — all in scripts/check-tests.sh.
      - run: nix develop --command check-tests
  assembler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # Drives the docs site's assembler the way the page does and checks that the
      # snippet and JaaS wiring it hands a visitor actually parse.
      - run: nix develop --command check-assembler
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # Persist kubeconform's downloaded schemas (Gateway API + operator CRDs)
      # across runs so validation does not re-fetch them every time. The rolling
      # run-id key with a shared restore prefix keeps it append-only: each run
      # restores the newest cache and saves a superset.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: nix develop --command check-examples
  readme-examples:
    # Renders the deploy examples embedded in workload READMEs and validates
    # their manifests with kubeconform, so a stale README example fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: nix develop --command check-readme-examples
  coverage:
    # The catalog-driven battery: renders every feature/recipe/profile/kind
    # composition generated from the catalog and validates each with kubeconform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: nix develop --command check-coverage
  security:
    # Kubernetes static analysis over the rendered manifests: kurly's own
    # invariants as conftest/Rego, plus pluto (deprecated APIs) and kubesec.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command check-security
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command reuse lint
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command yamllint .
  github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # The devShell carries shellcheck alongside actionlint, so run: blocks
      # are shell-linted too — without it actionlint silently skips them.
      - run: nix develop --command actionlint
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # Renovate stops opening pull requests entirely when its config is
      # invalid, and says so only in an issue — so a bad regex silently ends
      # dependency updates for the whole repository until somebody notices. It
      # is the one config here whose failure mode is silence, which is exactly
      # what a gate is for. Its regexes run under RE2, where a bounded
      # repetition may not exceed 1000 and lookaround does not exist, so a
      # pattern that a local test accepts can still be rejected there.
      - run: nix develop --command renovate-config-validator
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command markdownlint-cli2 "**/*.md" "#vendor" "#docs/themes"
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command typos
  policy:
    # The metio org convention policies (conftest/Rego) from metio/ci: SHA
    # pins, permissions, timeouts, run-injection, and — because this repo
    # ships a flake.nix — the flake-owned-toolchain rules.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/ci/policy-check@8470d3176f66a800c48c79697518042b66146450 # 2026.7.30140746
  dco:
    # Developer Certificate of Origin: every commit must carry a Signed-off-by
    # trailer. Skipped for bot-authored PRs (Renovate/Dependabot cannot sign off);
    # a skipped job still satisfies the all-green gate below.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/ci/dco@8470d3176f66a800c48c79697518042b66146450 # main
  verify:
    # Single required check covering every job above: mark only this one
    # required in branch protection and new jobs are covered automatically.
    name: Verify
    needs: [fmt, catalog, test, assembler, examples, readme-examples, coverage, security, reuse, yaml, github-actions, renovate, markdown, typos, policy, dco]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
