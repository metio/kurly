# Every tool gate comes from .breto.edn, so CI and local shells resolve the same
# tool versions.
# Renovate maintains the lock; no job installs tools any other way.
name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - run: check-fmt
  catalog:
    # Regenerates .build/catalog.json and then fails on drift — which also runs
    # the drift asserts that fail when a feature and its annotation fall out of
    # step, or when a generated ledger names a stage that no longer exists.
    #
    # It does NOT commit the result, and that is the point. catalog.json is a
    # build artifact: an aggregate of every workload, so every image bump moves
    # it. Committing it meant each Renovate pull request rewrote the same 1.9MB
    # file and they conflicted with one another; and this job pushing that commit
    # back to the pull-request branch was worse than untidy — the push
    # authenticates with GITHUB_TOKEN, GitHub does not trigger workflows from
    # GITHUB_TOKEN events, so the commit it had just pushed received no CI run.
    # The head commit ended up with no checks and the pull request could not be
    # merged by anyone.
    #
    # What is committed is what the catalogue is derived FROM: the annotations,
    # the stages, and the ledgers the network-bound generators write. The file
    # itself is gitignored and regenerated wherever it is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - run: gen-catalog
      - run: check-catalog
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      # Vendors k8s-libsonnet (floats at upstream HEAD, matching the JOI
      # images), runs the assertion suite, and exercises the requiresService
      # negative check — all in scripts/check-tests.sh.
      - run: check-tests
  assembler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      # Drives the docs site's assembler the way the page does and checks that the
      # snippet and JaaS wiring it hands a visitor actually parse.
      - run: check-assembler
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      # Persist kubeconform's downloaded schemas (Gateway API + operator CRDs)
      # across runs so validation does not re-fetch them every time. The rolling
      # run-id key with a shared restore prefix keeps it append-only: each run
      # restores the newest cache and saves a superset.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: check-examples
  readme-examples:
    # Renders the deploy examples embedded in workload READMEs and validates
    # their manifests with kubeconform, so a stale README example fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: check-readme-examples
  coverage:
    # The catalog-driven battery: renders every feature/recipe/profile/kind
    # composition generated from the catalog and validates each with kubeconform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ github.run_id }}
          restore-keys: kubeconform-schemas-
      - run: check-coverage
  security:
    # Kubernetes static analysis over the rendered manifests: kurly's own
    # invariants as conftest/Rego, plus pluto (deprecated APIs) and kubesec.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - run: check-security
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
      - run: breto run check-shell
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      # Renovate stops opening pull requests entirely when its config is
      # invalid, and says so only in an issue — so a bad regex silently ends
      # dependency updates for the whole repository until somebody notices. It
      # is the one config here whose failure mode is silence, which is exactly
      # what a gate is for. Its regexes run under RE2, where a bounded
      # repetition may not exceed 1000 and lookaround does not exist, so a
      # pattern that a local test accepts can still be rejected there.
      - run: renovate-config-validator
  verify:
    # Single required check covering every job above: mark only this one
    # required in branch protection and new jobs are covered automatically.
    name: Verify
    needs: [fmt, catalog, test, assembler, examples, readme-examples, coverage, security, lint, renovate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
