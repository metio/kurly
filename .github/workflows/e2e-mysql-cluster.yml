# Per-workload e2e for mysql-cluster (operator schema check). Self-gated on this
# workload plus the shared library and e2e machinery.
name: E2E mysql-cluster
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/mysql-cluster/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: mysql-cluster
      # yamllint disable-line rule:line-length
      paths: '^(workloads/mysql-cluster/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-mysql-cluster)\.sh|\.github/workflows/e2e(-mysql-cluster)?\.yml)'
      scenario: hack/smoke/scenario-mysql-cluster.sh
      max_versions: '1'
