# SPDX-License-Identifier: 0BSD

# Multi-unit releases from one repository, modeled on metio/helm-charts: each
# releasable unit — the library plus every directory under workloads/ — is
# detected, versioned, published, tagged (<unit>-<version>), and changelogged
# independently. Every unit released in one run shares a single metio/ci
# calver version; release notes are rendered per unit by git-cliff, scoped to
# the unit's paths and tag lineage, so one unit's commits never leak into
# another's changelog and one unit's failure never blocks another's release.
#
# Units and their artifacts:
# - library → ghcr.io/metio/kurly — single-layer image laid out like a jb
#   vendor/ tree (Flux OCIRepository source, image-volume mount, jb install).
# - workloads/<name> → ghcr.io/metio/kurly/workloads/<name> — a SINGLE-LAYER
#   FROM-scratch vendor-tree image of the workload's jsonnet SOURCE (same shape
#   as the library image), rendered by JaaS with the consumer's parameters.
#
# Change detection covers this push's range only (like helm-charts): a failed
# run is recovered by re-running via workflow_dispatch, whose empty input
# releases everything. Library changes do not re-release workloads — a
# workload picks up library changes with its own next release (or a forced
# dispatch), mirroring how helm-charts handles its common library chart.
name: Release
on:
  push:
    branches: [main]
    paths:
      - '*.libsonnet'
      - 'lib/**'
      - Containerfile
      - workload.Containerfile
      - 'catalog/**'
      - 'workloads/**'
      # A workload README is documentation, not shipped in the source artifact,
      # so a README-only edit must not cut a release.
      - '!workloads/**/README.md'
  workflow_dispatch:
    inputs:
      unit:
        description: Unit to force-release ("library", "catalog", or a directory name under workloads/). Leave empty to release every unit.
        required: false
permissions:
  contents: read
# Serialize release runs. A unit's release notes are scoped to the range since
# its previous <unit>-* tag; two runs touching the same unit in quick
# succession would race on creating that tag and produce overlapping notes.
# Queueing (no cancel) lets the earlier run tag first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  discover:
    name: Discover changed units
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      library: ${{ steps.changed.outputs.library }}
      catalog: ${{ steps.changed.outputs.catalog }}
      workloads: ${{ steps.changed.outputs.workloads }}
      shard0: ${{ steps.changed.outputs.shard0 }}
      shard1: ${{ steps.changed.outputs.shard1 }}
      shard2: ${{ steps.changed.outputs.shard2 }}
      shard3: ${{ steps.changed.outputs.shard3 }}
      any: ${{ steps.changed.outputs.any }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          # Via env, never inlined into the script: a dispatch input containing
          # a quote would otherwise inject commands into the release pipeline.
          UNIT_INPUT: ${{ github.event.inputs.unit }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all_workloads() { find workloads -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort || true; }
          # Each non-workload unit's name is also its tag prefix, so a workload
          # directory of that name would collide with it.
          for reserved in library catalog; do
            if all_workloads | grep -qx "$reserved"; then
              echo "::error::a workload must not be named '$reserved' (reserved for that unit's tags)"
              exit 1
            fi
          done
          library=false
          catalog=false
          workloads=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$UNIT_INPUT" ]; then
              library=true
              catalog=true
              workloads="$(all_workloads)"
            elif [ "$UNIT_INPUT" = "library" ]; then
              library=true
            elif [ "$UNIT_INPUT" = "catalog" ]; then
              catalog=true
            elif [ -d "workloads/$UNIT_INPUT" ]; then
              workloads="$UNIT_INPUT"
            else
              echo "::error::no such unit: $UNIT_INPUT"
              exit 1
            fi
          else
            # On the first push to the branch BEFORE is the all-zeros SHA (and
            # the commit isn't present), so the diff would fail — treat every
            # unit as changed instead of silently releasing nothing.
            if [ -z "$BEFORE" ] || ! git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
              library=true
              catalog=true
              workloads="$(all_workloads)"
            else
              diff="$(git diff --name-only "$BEFORE" "$SHA")"
              # The library unit is main.libsonnet plus the recipe modules under
              # lib/ (and its Containerfile). Matching only root-level *.libsonnet
              # would miss every lib/ change and silently skip a library release.
              echo "$diff" | grep -qE '^([^/]+\.libsonnet|lib/.*\.libsonnet|Containerfile)$' && library=true
              # The catalog artifact is the generated catalog.json and the file
              # that packages it. Gating on catalog/** matters beyond release
              # noise: a consumer pins this image, so republishing it on every
              # merge would open a pull request there for changes it cannot see.
              echo "$diff" | grep -qE '^catalog/.*$' && catalog=true
              # A README-only change to a workload is not a release (the README
              # is docs, not part of the shipped source artifact). And only a
              # workload whose directory still EXISTS is releasable — a DELETED
              # workload still appears in the diff's paths but has nothing to
              # release (it would publish a bogus empty image + tag).
              workloads="$(echo "$diff" | grep -v '/README\.md$' | grep -oP '^workloads/\K[^/]+' | sort -u \
                | while IFS= read -r w; do [ -n "$w" ] && [ -d "workloads/$w" ] && echo "$w"; done || true)"
              # The shared workload Containerfile packages EVERY workload, so a
              # change to it must re-release all of them — otherwise editing the
              # build would silently rebuild nothing.
              if echo "$diff" | grep -qx 'workload.Containerfile'; then
                workloads="$(all_workloads)"
              fi
            fi
          fi
          {
            echo "library=$library"
            echo "catalog=$catalog"
            echo "workloads=$(printf '%s\n' "$workloads" | grep -v '^$' | jq --raw-input . | jq --slurp --compact-output .)"
            # The same list split across four shards, because GitHub refuses a
            # job whose matrix exceeds 256 configurations and the fleet is past
            # that — a full release failed before running a single job. Sharded
            # round-robin (NR % 4) rather than in contiguous blocks, so the
            # shards stay balanced at any fleet size.
            for s in 0 1 2 3; do
              echo "shard${s}=$(printf '%s\n' "$workloads" | grep -v '^$' \
                | awk -v s="$s" 'NR % 4 == s' | jq --raw-input . | jq --slurp --compact-output .)"
            done
            if [ "$library" = "true" ] || [ "$catalog" = "true" ] || [ -n "$workloads" ]; then echo "any=true"; else echo "any=false"; fi
          } >> "$GITHUB_OUTPUT"
      - id: version
        name: Compute the shared version for this run
        if: steps.changed.outputs.any == 'true'
        uses: metio/ci/calver@8470d3176f66a800c48c79697518042b66146450 # 2026.7.30140746
  validate:
    name: Test the library and workloads
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command check-tests
      - run: nix develop --command check-examples
      - run: nix develop --command check-security
  library:
    name: Release the library
    needs: [discover, validate]
    if: needs.discover.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the library-<version> tag + GitHub Release
      packages: write # push to GHCR
      id-token: write # cosign keyless image signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Assert single layer and render from the built image
        # Single layer is the library-image contract: it serves as both an
        # image-volume mount and a Flux OCIRepository source without a
        # layerSelector. (Workload source images are single-layer for the same
        # reason — see the workload job below.)
        #
        # And the layer must carry the WHOLE library, not just main.libsonnet:
        # render kurly.http straight out of the image's own tree, with
        # k8s-libsonnet supplied separately the way JaaS does. A layer missing
        # lib/ passes the count check but fails the first `import './lib/…'` — so
        # this render, not the count, is what proves the artifact is consumable.
        run: |
          set -euo pipefail
          docker buildx build --load --file Containerfile --tag kurly-verify:latest .
          n=$(docker image inspect kurly-verify:latest --format '{{ len .RootFS.Layers }}')
          [ "$n" = "1" ] || { echo "::error::kurly image has $n layers, expected 1"; exit 1; }
          tree="$(mktemp -d)"
          # A FROM-scratch image carries no command, and `docker create` rejects
          # that ("No command specified") — pass a throwaway one; it is never run,
          # the container exists only to export its filesystem.
          cid="$(docker create kurly-verify:latest /nonexistent)"
          docker export "$cid" | tar -xf - -C "$tree"
          docker rm "$cid" >/dev/null
          # k8s-libsonnet is not in the image (JaaS supplies it); vendor it here
          # and drop just its tree beside the extracted library.
          nix develop --command jb install
          cp -r vendor/github.com/jsonnet-libs "$tree/github.com/"
          kind="$(nix develop --command jsonnet -J "$tree" -e \
            "local kurly = import 'github.com/metio/kurly/main.libsonnet'; kurly.list(kurly.http('probe', 'img:1')).items[0].kind")"
          [ "$kind" = '"Deployment"' ] || { echo "::error::library image did not render kurly.http (got: $kind) — the layer is missing lib/"; exit 1; }
          echo "library image renders kurly.http from its own tree"
      - name: Build, push and sign the image
        uses: metio/ci/container-release@8470d3176f66a800c48c79697518042b66146450 # 2026.7.30140746
        with:
          image: ghcr.io/metio/kurly
          version: ${{ needs.discover.outputs.version }}
          file: ./Containerfile
      - id: prev
        name: Find this unit's previous tag
        run: echo "prev=$(git tag --list 'library-*' --sort=-creatordate | head -1)" >> "$GITHUB_OUTPUT"
      - id: notes
        name: Generate Release Notes
        uses: metio/ci/release-notes@8470d3176f66a800c48c79697518042b66146450 # 2026.7.30140746
        env:
          # The org cliff config renders the unit name into the notes header.
          CHART: library
        with:
          version: library-${{ needs.discover.outputs.version }}
          previous: ${{ steps.prev.outputs.prev }}
          # Path-scoped notes since this unit's last tag; tag-pattern keeps
          # another unit's tag inside the range from splitting the notes.
          include-paths: '*.libsonnet lib Containerfile'
          tag-pattern: ^library-
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.discover.outputs.version }}
          SHA: ${{ github.sha }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          tag="library-${VERSION}"
          cat >> "$NOTES" <<EOF

          ## Artifacts

          \`ghcr.io/metio/kurly:${VERSION}\` — single layer, jb vendor-tree
          layout; register it as a JsonnetLibrary (Flux OCIRepository source)
          or mount it as an image volume. Signed with cosign keyless.
          EOF
          git tag "$tag" "$SHA"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file "$NOTES"
  catalog:
    name: Release catalog
    # The catalogue names the artifacts its facts were generated from, so it must
    # publish AFTER them: released in parallel, it would stamp whatever the
    # registry held a moment ago, and the workload whose facts just changed is
    # exactly the one whose stamp would be missing or stale. Everything else
    # would stamp correctly from its git tag, so it would look like it worked.
    #
    # always(), because a unit not released in this run is skipped rather than
    # failed, and a skipped dependency would otherwise skip the catalogue too. A
    # unit that genuinely FAILED still blocks it: a catalogue that names an
    # artifact whose push did not finish is the specific lie this ordering
    # exists to prevent.
    needs: [discover, validate, library, workload-0, workload-1, workload-2, workload-3]
    if: >-
      always() && needs.discover.outputs.catalog == 'true'
      && needs.validate.result == 'success'
      && needs.library.result != 'failure'
      && needs.workload-0.result != 'failure'
      && needs.workload-1.result != 'failure'
      && needs.workload-2.result != 'failure'
      && needs.workload-3.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the catalog-<version> tag + GitHub Release
      packages: write # push to GHCR
      id-token: write # cosign keyless artifact signing
      attestations: write # attach build provenance as a referrer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # The catalogue names the artifacts its facts came from. Nothing before the
      # release can do this: those artifacts do not exist yet. Everything the
      # stamp adds is derived from this run's version, the repository's release
      # tags, and the registry answering for a NAMED tag — never for "newest".
      - name: Name the artifacts this catalog describes
        env:
          VERSION: ${{ needs.discover.outputs.version }}
          RELEASED: >-
            ${{ needs.discover.outputs.library == 'true' && 'library' || '' }}
            ${{ join(fromJSON(needs.discover.outputs.workloads), ' ') }}
        run: |
          set -euo pipefail
          nix develop --command jb install >/dev/null
          # The unstamped rendering, kept for the comparison below. catalog.json is
          # not committed, so "what you can read in git" is the SOURCE it renders
          # from — this is that rendering, made before the stamp touches it.
          nix develop --command gen-catalog
          cp .build/catalog.json /tmp/catalog.unstamped.json
          nix develop --command stamp-catalog
      # What the source renders to is what ships, with one enumerated exception.
      # The stamped keys are the only fields allowed to differ, and they are
      # removed before the comparison rather than the comparison being relaxed —
      # a release job that changed anything else fails here.
      - name: The published document is the rendered one plus the stamp
        run: |
          set -euo pipefail
          stripped="$(mktemp)"
          jq 'del(.library, .k8sLibsonnet) | .workloads |= map(del(.artifact))' .build/catalog.json > "$stripped"
          jq . /tmp/catalog.unstamped.json > "${stripped}.unstamped"
          diff -u "${stripped}.unstamped" "$stripped" || {
            echo "::error::the release changed the catalog beyond the artifact stamp"
            exit 1
          }
          echo "the published catalog is the rendered one plus the artifacts it names"
      - name: The document a consumer will read
        # The published artifact is library.json, so this checks that file: the
        # schema version a consumer refuses to boot on, and a non-empty
        # vocabulary. A published-but-empty document would otherwise reach a
        # consumer as "every term disappeared".
        run: |
          set -euo pipefail
          nix develop --command gen-library .build/library.json
          version="$(jq -r '.schemaVersion // empty' .build/library.json)"
          [ -n "$version" ] || { echo "::error::library document carries no schemaVersion"; exit 1; }
          jq -e '.library.requiresKinds | length > 0' .build/library.json >/dev/null \
            || { echo "::error::library document carries no vocabularies"; exit 1; }
          echo "library document carries schemaVersion ${version}"
      # A PLAIN OCI ARTIFACT, not a container image. The catalogue is data with
      # no platform, and publishing it as an image produced a multi-platform
      # index whose six children all pointed at the same blob — six identical
      # copies of a JSON file, none carrying a layer title, so `oras pull`
      # downloaded every manifest and wrote nothing. Getting one file out meant
      # walking the index, filtering the attestation manifests, and fetching the
      # blob by hand.
      #
      # One manifest, one titled layer. `oras pull` writes library.json into the
      # working directory and that is the whole consumer side.
      #
      # The layer is what the catalogue holds that is NOT about one workload: the
      # closed vocabularies, the library's API model, and the exclusions. Every
      # per-workload fact rides on that workload's OWN artifact, published beside
      # the bits it describes and pinned by the same digest — so a consumer that
      # pins a workload can never read facts belonging to a different build of
      # it. `excluded` has nowhere else to ride: a workload kurly refuses to
      # carry has no artifact to attach anything to, which is why the list is
      # published here.
      #
      # There is deliberately NO aggregate document. One file naming every
      # workload is a single point every change has to touch — it made every
      # dependency-update PR conflict on the same lines, and it forced CI to
      # commit a regenerated copy onto the PR branch, whose head commit then ran
      # no workflows at all. A consumer reading it also held facts from whatever
      # build produced the aggregate rather than from the images it pinned.
      - id: push
        name: Push the catalog artifact
        env:
          VERSION: ${{ needs.discover.outputs.version }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix develop --command oras login ghcr.io --username "$ACTOR" --password "$GH_TOKEN"
          # Pushed from inside the build directory, because oras takes the layer
          # title from the path it is given and a consumer should get
          # `library.json` rather than `.build/library.json`.
          cd .build
          nix develop --command oras push \
            "ghcr.io/metio/kurly/catalog:${VERSION},latest" \
            --artifact-type application/vnd.metio.kurly.catalog.v1+json \
            library.json:application/json
          digest="$(nix develop --command oras resolve "ghcr.io/metio/kurly/catalog:${VERSION}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ghcr.io/metio/kurly/catalog@${digest}"
      - name: Sign the artifact
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: nix develop --command cosign sign --yes "ghcr.io/metio/kurly/catalog@${DIGEST}"
      # Provenance came free from buildx when this was an image. It is worth
      # keeping, so it is attached explicitly — as a referrer on the artifact,
      # which is where the referrers API expects it and which leaves the
      # artifact itself uncluttered.
      - name: Attach build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/metio/kurly/catalog
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # What a consumer will actually run, against what was just published.
      - name: A consumer can pull it with one command
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          (cd "$out" && nix develop --command oras pull "ghcr.io/metio/kurly/catalog@${DIGEST}")
          [ -f "${out}/library.json" ] || { echo "::error::oras pull wrote no library.json"; exit 1; }
          diff -q "${out}/library.json" .build/library.json
          echo "oras pull yields library.json, byte-identical to what was published"
      - id: prev
        name: Find this unit's previous tag
        run: echo "prev=$(git tag --list 'catalog-*' --sort=-creatordate | head -1)" >> "$GITHUB_OUTPUT"
      - id: notes
        name: Generate Release Notes
        uses: metio/ci/release-notes@8470d3176f66a800c48c79697518042b66146450 # 2026.7.30140746
        env:
          # The org cliff config renders the unit name into the notes header.
          CHART: catalog
        with:
          version: catalog-${{ needs.discover.outputs.version }}
          previous: ${{ steps.prev.outputs.prev }}
          # Path-scoped notes since this unit's last tag; tag-pattern keeps
          # another unit's tag inside the range from splitting the notes.
          include-paths: catalog
          tag-pattern: ^catalog-
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.discover.outputs.version }}
          SHA: ${{ github.sha }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          tag="catalog-${VERSION}"
          cat >> "$NOTES" <<EOF

          ## Artifacts

          \`ghcr.io/metio/kurly/catalog:${VERSION}\` — single layer holding
          \`library.json\`: the closed vocabularies, the library's API model and
          the exclusions. Fetch it with \`oras pull\` and pin it by digest.
          Signed with cosign keyless.

          Per-workload facts are published on each workload's OWN artifact as an
          OCI referrer, pinned by the same digest as the bits they describe.
          There is no aggregate \`catalog.json\`.
          EOF
          git tag "$tag" "$SHA"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file "$NOTES"
  # The workload units, sharded. GitHub caps a JOB's matrix at 256
  # configurations and the fleet is past that, so the list is split and each
  # shard carries its own matrix — the cap then applies per shard rather than
  # to the fleet. Four shards carry 1024 workloads; a fifth is one more caller,
  # not a redesign. The steps live once in release-workload.yml.
  #
  # Sharded round-robin rather than in contiguous blocks, so the shards stay
  # balanced whatever the fleet size — and a run releasing three workloads does
  # not put all three in one shard while the other three jobs sit idle.
  workload-0:
    name: Release workloads 1/4
    needs: [discover, validate]
    if: needs.discover.outputs.shard0 != '[]'
    strategy:
      # One workload's failure must not block another's release.
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.discover.outputs.shard0) }}
    uses: ./.github/workflows/release-workload.yml
    with:
      workload: ${{ matrix.workload }}
      version: ${{ needs.discover.outputs.version }}
    secrets: inherit
  workload-1:
    name: Release workloads 2/4
    needs: [discover, validate]
    if: needs.discover.outputs.shard1 != '[]'
    strategy:
      # One workload's failure must not block another's release.
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.discover.outputs.shard1) }}
    uses: ./.github/workflows/release-workload.yml
    with:
      workload: ${{ matrix.workload }}
      version: ${{ needs.discover.outputs.version }}
    secrets: inherit
  workload-2:
    name: Release workloads 3/4
    needs: [discover, validate]
    if: needs.discover.outputs.shard2 != '[]'
    strategy:
      # One workload's failure must not block another's release.
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.discover.outputs.shard2) }}
    uses: ./.github/workflows/release-workload.yml
    with:
      workload: ${{ matrix.workload }}
      version: ${{ needs.discover.outputs.version }}
    secrets: inherit
  workload-3:
    name: Release workloads 4/4
    needs: [discover, validate]
    if: needs.discover.outputs.shard3 != '[]'
    strategy:
      # One workload's failure must not block another's release.
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.discover.outputs.shard3) }}
    uses: ./.github/workflows/release-workload.yml
    with:
      workload: ${{ matrix.workload }}
      version: ${{ needs.discover.outputs.version }}
    secrets: inherit
