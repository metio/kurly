# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for smtp4dev. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E smtp4dev
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/smtp4dev/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-smtp4dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: smtp4dev
      paths: '^workloads/smtp4dev/'
      scenario: hack/smoke/scenario-smtp4dev.sh
      max_versions: '1'
