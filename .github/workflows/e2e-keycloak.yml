# Per-workload e2e for keycloak (operator schema check). Self-gated on this
# workload plus the shared library and e2e machinery.
name: E2E keycloak
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: keycloak
      # yamllint disable-line rule:line-length
      paths: '^(workloads/keycloak/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-keycloak)\.sh|\.github/workflows/e2e(-keycloak)?\.yml)'
      scenario: hack/smoke/scenario-keycloak.sh
      max_versions: '1'
