# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for n8n. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E n8n
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: n8n
      # yamllint disable-line rule:line-length
      paths: '^(workloads/n8n/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-n8n)\.sh|\.github/workflows/e2e(-n8n)?\.yml)'
      scenario: hack/smoke/scenario-n8n.sh
      max_versions: '1'
