# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for lobe-chat. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E lobe-chat
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/lobe-chat/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-lobe-chat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: lobe-chat
      paths: '^workloads/lobe-chat/'
      scenario: hack/smoke/scenario-lobe-chat.sh
      max_versions: '1'
