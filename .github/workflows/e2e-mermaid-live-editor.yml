# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for mermaid-live-editor. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E mermaid-live-editor
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/mermaid-live-editor/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-mermaid-live-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: mermaid-live-editor
      paths: '^workloads/mermaid-live-editor/'
      scenario: hack/smoke/scenario-mermaid-live-editor.sh
      max_versions: '1'
