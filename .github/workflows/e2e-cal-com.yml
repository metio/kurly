# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for cal-com. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E cal-com
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: cal-com
      # yamllint disable-line rule:line-length
      paths: '^(workloads/cal-com/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-cal-com)\.sh|\.github/workflows/e2e(-cal-com)?\.yml)'
      scenario: hack/smoke/scenario-cal-com.sh
      max_versions: '1'
