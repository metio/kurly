# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for pyload-ng. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E pyload-ng
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: pyload-ng
      # yamllint disable-line rule:line-length
      paths: '^(workloads/pyload-ng/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-pyload-ng)\.sh|\.github/workflows/e2e(-pyload-ng)?\.yml)'
      scenario: hack/smoke/scenario-pyload-ng.sh
      max_versions: '1'
