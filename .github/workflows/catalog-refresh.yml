# Re-asks the facts the catalogue derives from somewhere other than this
# repository, and opens a pull request when an answer has changed.
#
# The per-PR gate can only check the facts it can recompute offline. A licence,
# an image's architectures, its labels and its signature live in other people's
# systems: a project relicenses, an image starts publishing arm64, a publisher
# starts signing its releases, a maintainer moves the
# repository, and so does whether a publisher signs what it ships. None of that
# produces a commit here, so without a scheduled ask
# the catalogue keeps publishing last year's answer with no sign that it is old
# — which is the failure that matters, because the answer still looks confident.
#
# So they are asked again every week and the diff becomes a pull request. Nobody
# has to remember to run anything, and a change to what the world says arrives
# as something to review rather than as a discovery months later.
#
# gen-forge is fast here and slow locally for the same reason: GitHub answers
# sixty requests an hour unauthenticated and five thousand with a token, and CI
# has a token of its own. gen-upstream is the exception — it asks three hundred
# registries that rate-limit far harder, takes hours, and is left to a manual
# dispatch.
name: Catalog refresh
on:
  schedule:
    # Saturdays, well clear of the Monday release run.
    - cron: 23 5 * * SAT
  workflow_dispatch:
    inputs:
      images:
        description: 'Also re-read every image label (slow; hours against rate-limiting registries).'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    name: Re-ask the derived facts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Ask every upstream forge for its licence
        env:
          # The run's own token, which only lifts the rate limit — the API calls
          # read public repositories and need no permission beyond that.
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command gen-forge
      - name: Ask every registry which architectures its image publishes
        run: nix develop --command gen-architectures
      - name: Ask every image whether it is signed, and by whom
        # A signature is about specific bytes, so this answer expires whenever
        # Renovate bumps an image — the catalogue drops the claim by itself and
        # this run is what earns it back.
        run: nix develop --command gen-signatures
      - name: Re-read every image label
        if: inputs.images
        run: nix develop --command gen-upstream
      - name: Rebuild the catalog from the new answers
        run: |
          set -euo pipefail
          nix develop --command jb install
          mkdir -p vendor/github.com/metio
          ln -sfn ../../.. vendor/github.com/metio/kurly
          nix develop --command jsonnet -J vendor catalog/catalog.jsonnet > .build/catalog.json
      # A pull request rather than a push to the default branch: publishing the
      # catalogue is a release, and a licence that changed is exactly the kind of
      # thing somebody should read before it ships.
      #
      # Opened with CATALOG_REFRESH_TOKEN rather than the run's own token, because
      # GitHub does not trigger workflows from events created with GITHUB_TOKEN —
      # the guard against a workflow triggering itself for ever. A pull request
      # opened that way fires no `pull_request` event, so Verify never runs, its
      # required checks never report, and the pull request cannot be merged by
      # anyone. It needs an identity of its own: a fine-grained PAT or a GitHub App
      # installation token with `contents: write` and `pull-requests: write`.
      #
      # Falls back to the run's token when that secret is absent, so a repository
      # without it still gets the pull request — it just has to be merged by hand,
      # which is the behaviour this replaced.
      - name: Open a pull request for whatever changed
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN || github.token }}
          CATALOG_REFRESH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/; then
            echo "nothing changed — every derived fact still matches what its source says"
            exit 0
          fi
          git --no-pager diff --stat -- catalog/
          branch="catalog-refresh/$(date +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git add catalog/
          git commit --message 'chore(catalog): re-ask the facts derived from elsewhere' \
            --message 'Licences come from each upstream repository, architectures from each image manifest. This is what those sources say today.'
          git push --set-upstream origin "$branch"
          gh pr create --fill --base "${GITHUB_REF_NAME}" \
            --title 'chore(catalog): refresh the facts derived from elsewhere'
          # Queued rather than merged: auto-merge waits for the required checks, so
          # the catalogue still only ships once the gate has agreed with it. With no
          # CATALOG_REFRESH_TOKEN there are no checks to wait for and this is a
          # no-op that leaves the pull request for a human, which is the honest
          # outcome — never a merge nothing verified.
          if [ -n "${CATALOG_REFRESH_TOKEN:-}" ]; then
            gh pr merge --auto --squash "$branch" || \
              echo "::warning::could not enable auto-merge — check that 'Allow auto-merge' is on for this repository"
          else
            echo "::warning::CATALOG_REFRESH_TOKEN is not set, so no CI ran on this pull request and it will not auto-merge; merge it by hand or add the secret"
          fi
