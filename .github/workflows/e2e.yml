# The single e2e pipeline. One job on one kind cluster (latest Kubernetes) walks
# the workloads a PR changed, running each one's fast check then its deep check
# (delivery through the latest Flux, JaaS, and stageset-controller). Unchanged
# workloads are skipped, so a Renovate image bump exercises exactly the workload
# it touched — one long-running run, never hundreds of parallel jobs. A manual
# dispatch may name an explicit space-separated `workloads` selection.
name: E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      workloads:
        description: 'Space-separated workloads to run; empty runs all changed.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bsi:
    name: BSI verdicts still match the policies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Create the kind cluster (latest Kubernetes)
        run: nix develop --command kind create cluster --wait 120s
      # The catalog publishes which bollwerk policies each stage breaks, judged by
      # an API server. Nothing keeps that true on its own: a relaxed security knob
      # or an edited policy changes the verdicts, and a published claim about
      # compliance must not lag either. So it is REGENERATED here and the run
      # fails if the committed answers differ — the data cannot go stale without
      # the pull request that staled it going red.
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          nix develop --command gen-bsi
          if ! git diff --quiet -- catalog/bsi.gen.libsonnet; then
            echo "::error::the BSI verdicts changed — run gen-bsi and commit catalog/bsi.gen.libsonnet"
            git --no-pager diff -- catalog/bsi.gen.libsonnet | head -60
            exit 1
          fi
          echo "the published BSI verdicts match what the API server says"
  changes:
    name: Which workloads changed?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      list: ${{ steps.detect.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          WORKLOADS: ${{ inputs.workloads }}
        run: |
          set -uo pipefail
          if [ -n "${WORKLOADS}" ]; then
            list="${WORKLOADS}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="$(printf '%s\n' workloads/*/ | sed -E 's#workloads/([^/]+)/#\1#' | tr '\n' ' ')"
          else
            list="$(git diff --name-only "origin/${BASE_REF}"...HEAD \
              | grep -oE '^workloads/[a-z0-9-]+/' | sed -E 's#workloads/([^/]+)/#\1#' | sort -u | tr '\n' ' ')"
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          if [ -z "${list// /}" ]; then
            echo "::notice::no workloads changed — the e2e run is a no-op"
          else
            echo "::notice::e2e will run: ${list}"
          fi
  e2e:
    name: Fast + deep e2e for changed workloads
    needs: changes
    if: needs.changes.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - name: Create the kind cluster (latest Kubernetes) with a registry port-map
        run: |
          nix develop --command kind create cluster --wait 120s \
            --config hack/smoke/kind-registry-config.yaml
      - name: Walk the changed workloads (fast then deep)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          WORKLOADS: ${{ needs.changes.outputs.list }}
        run: nix develop --command bash hack/smoke/e2e-run.sh
