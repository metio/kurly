# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for pairdrop. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E pairdrop
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/pairdrop/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-pairdrop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: pairdrop
      paths: '^workloads/pairdrop/'
      scenario: hack/smoke/scenario-pairdrop.sh
      max_versions: '1'
