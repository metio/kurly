# Per-workload e2e for opensearch-cluster (operator schema check). Self-gated on this
# workload plus the shared library and e2e machinery.
name: E2E opensearch-cluster
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: opensearch-cluster
      # yamllint disable-line rule:line-length
      paths: '^(workloads/opensearch-cluster/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-opensearch-cluster)\.sh|\.github/workflows/e2e(-opensearch-cluster)?\.yml)'
      scenario: hack/smoke/scenario-opensearch-cluster.sh
      max_versions: '1'
