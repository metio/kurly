# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for snipe-it. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E snipe-it
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: snipe-it
      # yamllint disable-line rule:line-length
      paths: '^(workloads/snipe-it/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-snipe-it)\.sh|\.github/workflows/e2e(-snipe-it)?\.yml)'
      scenario: hack/smoke/scenario-snipe-it.sh
      max_versions: '1'
