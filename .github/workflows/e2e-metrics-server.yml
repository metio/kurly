# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for metrics-server. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E metrics-server
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/metrics-server/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-metrics-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: metrics-server
      paths: '^workloads/metrics-server/'
      scenario: hack/smoke/scenario-metrics-server.sh
      max_versions: '1'
