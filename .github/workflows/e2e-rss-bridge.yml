# Per-workload e2e for rss-bridge. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E rss-bridge
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: rss-bridge
      # yamllint disable-line rule:line-length
      paths: '^(workloads/rss-bridge/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-rss-bridge)\.sh|\.github/workflows/e2e(-rss-bridge)?\.yml)'
      scenario: hack/smoke/scenario-rss-bridge.sh
