# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for rss-bridge. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E rss-bridge
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/rss-bridge/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-rss-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: rss-bridge
      paths: '^workloads/rss-bridge/'
      scenario: hack/smoke/scenario-rss-bridge.sh
      max_versions: '1'
