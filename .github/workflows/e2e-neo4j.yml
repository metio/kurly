# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for neo4j. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E neo4j
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: neo4j
      # yamllint disable-line rule:line-length
      paths: '^(workloads/neo4j/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-neo4j)\.sh|\.github/workflows/e2e(-neo4j)?\.yml)'
      scenario: hack/smoke/scenario-neo4j.sh
