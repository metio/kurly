# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for element-web. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E element-web
on:
  pull_request:
    branches: [main]
    paths:
      - 'workloads/element-web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-element-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: element-web
      paths: '^workloads/element-web/'
      scenario: hack/smoke/scenario-element-web.sh
      max_versions: '1'
