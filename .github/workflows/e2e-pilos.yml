# generated by scripts/gen-smoke.sh — do not edit; regenerate with: gen-smoke
# Per-workload e2e for pilos. Self-gates on a diff scoped to this workload (plus the
# shared library and the e2e machinery), delegating the matrix + run to the
# reusable e2e workflow.
name: E2E pilos
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      workload: pilos
      # yamllint disable-line rule:line-length
      paths: '^(workloads/pilos/|lib/|main\.libsonnet|hack/smoke/(lib|scenario-pilos)\.sh|\.github/workflows/e2e(-pilos)?\.yml)'
      scenario: hack/smoke/scenario-pilos.sh
      max_versions: '1'
